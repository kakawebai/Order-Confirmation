<main>
  <h1>去白底工具</h1>
  <p class="sub">只去除与图片边缘相连的背景，内部的白色球衣、高光等细节原样保留。仍有残留的背景，直接点击预览图上那块区域即可去除。所有处理都在本地浏览器完成，图片不会上传。</p>

  <div class="panel">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入图片">

      <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="panel">

      <label class="row"><span>背景容差</span><input type="range" id="tol" min="0" max="80" value="12"><output id="tolV">12</output></label>
      <label class="row"><span>边缘柔化</span><input type="range" id="soft" min="0" max="40" value="10"><output id="softV">10</output></label>
      <label class="row"><span>裁掉空白边</span><input type="checkbox" id="crop"><span style="min-width:0">留边</span><input type="range" id="pad" min="0" max="80" value="8"><output id="padV">8</output></label>
      <label class="row"><span>封闭区容差</span><input type="range" id="holeTol" min="0" max="100" value="35"><output id="holeTolV">35</output></label>
      <label class="row"><span>封闭区最小面积</span><input type="range" id="holeMin" min="0" max="3" step="0.005" value="0.005"><output id="holeV">0.005%</output></label>
      <div class="row"><span>背景色</span>

      <label class="chk">预览底色
        <select id="prevBg"><option value="check">棋盘格</option><option value="dark">深色</option><option value="light">白色</option><option value="green">绿色</option></select>
      </label>

  <div class="panel bar">

    <label class="chk"><input type="checkbox" class="fmt" value="png" checked>PNG</label>
    <label class="chk"><input type="checkbox" class="fmt" value="webp">WebP</label>
    <label class="chk"><input type="checkbox" class="fmt" value="svg">SVG</label>
    <label class="chk"><input type="checkbox" class="fmt" value="jpg">JPG（用下方底色填充）</label>
    <input type="color" id="jpgBg" value="#ffffff" aria-label="JPG 底色">

    <button class="btn" id="dlAll" disabled>全部下载</button>

<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const items = [];
let timer = 0;

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const opts = () => ({
  tol: +$('tol').value, soft: +$('soft').value, auto: $('autoBg').checked, bg: hex2rgb($('bgColor').value),
  holes: $('holes').checked, holeMin: +$('holeMin').value, holeTol: +$('holeTol').value, crop: $('crop').checked, pad: +$('pad').value
});

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------- 核心：边缘漫水填充去背景 ---------- */
function cutout(img, o, seeds = []) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, w, h), d = id.data;

  // 背景基准色：四角平均（或手动指定）
  let bg = o.bg;
  if (o.auto) {
    const corners = [0, w - 1, (h - 1) * w, h * w - 1];
    bg = [0, 1, 2].map(k => Math.round(corners.reduce((s, p) => s + d[p * 4 + k], 0) / 4));
  }
  const [bR, bG, bB] = bg, tol = o.tol;
  const dist = i => { const p = i * 4; return Math.max(Math.abs(d[p] - bR), Math.abs(d[p + 1] - bG), Math.abs(d[p + 2] - bB)); };

  const vis = new Uint8Array(w * h);   // 1 = 要删除
  const seen = new Uint8Array(w * h);  // 1 = 已访问过
  const q = new Int32Array(w * h);
  let tail = 0, ref = bg, t = tol;
  const near = (i, r) => { const p = i * 4; return d[p + 3] < 8 || (Math.abs(d[p] - r[0]) <= t && Math.abs(d[p + 1] - r[1]) <= t && Math.abs(d[p + 2] - r[2]) <= t); };
  const push = n => { if (!seen[n] && near(n, ref)) { seen[n] = 1; q[tail++] = n; } };
  const run = start => {
    let head = start;
    while (head < tail) {
      const i = q[head++], x = i % w;
      if (x > 0) push(i - 1);
      if (x < w - 1) push(i + 1);
      if (i >= w) push(i - w);
      if (i < w * (h - 1)) push(i + w);
    }
  };
  const commit = s => { for (let k = s; k < tail; k++) vis[q[k]] = 1; };

  // 1) 从四条边界开始，删除与外部相连的背景
  let s0 = tail;
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  run(s0); commit(s0);

  // 2) 手动点击：以点击处的颜色为基准，删除相连的同色区域（用封闭区容差，更宽容）
  t = o.holeTol;
  for (const [sx, sy] of seeds) {
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
    const i = sy * w + sx;
    if (seen[i]) continue;
    ref = [d[i * 4], d[i * 4 + 1], d[i * 4 + 2]];
    s0 = tail; seen[i] = 1; q[tail++] = i; run(s0); commit(s0);
  }

  // 3) 被包围的背景（如提手内侧）：面积够大的背景色连通块才删，避免误伤细小高光
  ref = bg; t = o.holeTol;
  if (o.holes) {
    const minPx = o.holeMin * w * h / 100;
    for (let i = 0; i < w * h; i++) {
      if (seen[i] || !near(i, bg)) continue;
      s0 = tail; seen[i] = 1; q[tail++] = i; run(s0);
      if (tail - s0 >= minPx) commit(s0);
    }
  }

  t = tol;
  for (let i = 0; i < w * h; i++) if (vis[i]) d[i * 4 + 3] = 0;

  // 边缘柔化 + 去白边：靠近背景的像素按与背景的差异算透明度，并还原其本色
  if (o.soft > 0) {
    const edge = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (vis[i]) continue;
      if ((x > 0 && vis[i - 1]) || (x < w - 1 && vis[i + 1]) || (y > 0 && vis[i - w]) || (y < h - 1 && vis[i + w])) edge.push(i);
    }
    for (const i of edge) {
      const a = Math.min(1, Math.max(0.05, (dist(i) - tol) / o.soft)), p = i * 4;
      if (a < 1) {
        d[p] = Math.max(0, Math.min(255, bR + (d[p] - bR) / a));
        d[p + 1] = Math.max(0, Math.min(255, bG + (d[p + 1] - bG) / a));
        d[p + 2] = Math.max(0, Math.min(255, bB + (d[p + 2] - bB) / a));
        d[p + 3] = Math.round(a * 255);
      }
    }
  }
  ctx.putImageData(id, 0, 0);

  // 可选：裁掉透明空白
  if (o.crop) {
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 >= 0) {
      const p = o.pad, cw = x1 - x0 + 1 + p * 2, ch = y1 - y0 + 1 + p * 2;
      const c2 = document.createElement('canvas'); c2.width = cw; c2.height = ch;
      c2.getContext('2d').drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, p, p, x1 - x0 + 1, y1 - y0 + 1);
      c2.offX = x0 - p; c2.offY = y0 - p;
      return c2;
    }
  }
  c.offX = 0; c.offY = 0;
  return c;
}

/* ---------- 导出 ---------- */
const MIME = { png: 'image/png', webp: 'image/webp', jpg: 'image/jpeg' };
const toBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

async function exportBlob(cv, fmt) {
  if (fmt === 'png') return toBlob(cv, MIME.png);
  if (fmt === 'webp') return toBlob(cv, MIME.webp, 1);
  if (fmt === 'jpg') {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const x = c.getContext('2d'); x.fillStyle = $('jpgBg').value; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, 0);
    return toBlob(c, MIME.jpg, 0.95);
  }
  const url = await blobToDataURL(await toBlob(cv, MIME.png));
  const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${cv.width} ${cv.height}" width="${cv.width}" height="${cv.height}">\n  <image width="${cv.width}" height="${cv.height}" xlink:href="${url}"/>\n</svg>`;
  return new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
}
const fileName = (it, fmt) => it.base + (fmt === 'jpg' ? '' : '_transparent') + '.' + fmt;

function save(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadAll() {
  const fmts = [...document.querySelectorAll('.fmt:checked')].map(e => e.value);
  if (!fmts.length) return toast('请至少勾选一种导出格式');
  const jobs = [];
  for (const it of items) for (const f of fmts) jobs.push([it, f]);
  $('dlAll').disabled = true;
  try {
    if (jobs.length > 1 && window.JSZip) {
      const zip = new JSZip(), used = {};
      for (const [it, f] of jobs) {
        let n = fileName(it, f); used[n] = (used[n] || 0) + 1;
        if (used[n] > 1) n = n.replace(/(\.\w+)$/, `_${used[n]}$1`);
        zip.file(n, await exportBlob(it.out, f));
      }
      save(await zip.generateAsync({ type: 'blob' }), 'cutouts.zip');
    } else {
      for (const [it, f] of jobs) { save(await exportBlob(it.out, f), fileName(it, f)); await new Promise(r => setTimeout(r, 250)); }
    }
    toast(`已导出 ${jobs.length} 个文件`);
  } finally { $('dlAll').disabled = !items.length; }
}

/* ---------- 界面 ---------- */
function render() {
  const list = $('list');
  list.innerHTML = '';
  $('dlAll').disabled = $('clear').disabled = !items.length;
  if (!items.length) { list.innerHTML = '<div class="empty">还没有图片，先在上方添加。</div>'; return; }
  const o = opts();
  items.forEach((it, idx) => {
    it.out = cutout(it.img, o, it.seeds);
    it.out.style.cursor = 'crosshair';
    it.out.title = '点击残留的背景区域，可直接去除';
    it.out.onclick = e => {
      const r = it.out.getBoundingClientRect();
      it.seeds.push([Math.floor((e.clientX - r.left) / r.width * it.out.width) + it.out.offX, Math.floor((e.clientY - r.top) / r.height * it.out.height) + it.out.offY]);
      render();
    };
    const card = document.createElement('div'); card.className = 'card';
    const stage = document.createElement('div'); stage.className = 'stage'; stage.dataset.bg = $('prevBg').value;
    stage.appendChild(it.out);
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = '<span class="n"></span><span class="d">' + it.out.width + ' × ' + it.out.height + '</span>';
    meta.firstChild.textContent = it.base; meta.firstChild.title = it.base;
    const acts = document.createElement('div'); acts.className = 'acts';
    [['png', 'PNG'], ['webp', 'WebP'], ['svg', 'SVG'], ['jpg', 'JPG']].forEach(([f, label]) => {
      const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = label;
      b.onclick = async () => save(await exportBlob(it.out, f), fileName(it, f));
      acts.appendChild(b);
    });
    const cp = document.createElement('button'); cp.className = 'btn sm ghost'; cp.textContent = '复制图片';
    cp.onclick = async () => {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': toBlob(it.out, MIME.png) })]); toast('已复制到剪贴板'); }
      catch (e) { toast('当前浏览器不允许复制，请改用下载'); }
    };
    const rm = document.createElement('button'); rm.className = 'btn sm ghost'; rm.textContent = '移除';
    rm.onclick = () => { items.splice(idx, 1); render(); };
    const un = document.createElement('button'); un.className = 'btn sm ghost'; un.textContent = '撤销点击'; un.disabled = !it.seeds.length;
    un.onclick = () => { it.seeds.pop(); render(); };
    acts.append(cp, un, rm);
    card.append(stage, meta, acts);
    list.appendChild(card);
  });
}
const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 120); };

function addFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return toast('没有识别到图片文件');
  Promise.all(imgs.map(f => new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => res({ img, seeds: [], base: f.name.replace(/\.[^/.]+$/, '') || 'image' });
    img.onerror = () => { toast('无法读取：' + f.name); res(null); };
    img.src = url;
  }))).then(r => { r.filter(Boolean).forEach(x => items.push(x)); render(); });
}

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
window.addEventListener('paste', e => addFiles([...e.clipboardData.files]));

[['tol', 'tolV', ''], ['soft', 'softV', ''], ['pad', 'padV', ''], ['holeMin', 'holeV', '%'], ['holeTol', 'holeTolV', '']].forEach(([a, b, u]) => $(a).addEventListener('input', () => { $(b).textContent = $(a).value + u; schedule(); }));
['holes', 'crop', 'bgColor'].forEach(id => $(id).addEventListener('input', schedule));
$('autoBg').onchange = () => { $('bgColor').disabled = $('autoBg').checked; schedule(); };
$('prevBg').onchange = () => document.querySelectorAll('.stage').forEach(s => s.dataset.bg = $('prevBg').value);
$('dlAll').onclick = downloadAll;
$('clear').onclick = () => { items.length = 0; render(); };
</script>
</body>
